<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
/* 配色 = 工作台统一视觉令牌的同一组值（出处：work/07_cfd_pipeline/workspace/pro/tokens.css）。
   本页是自包含单文件产物，故内联而不外链；改色请先改 tokens.css 再同步此处。
   纪律：chrome 一律单色（明度分级 + 徽章反转），颜色只留给数据（速度/静压色带、坐标尺）；
   圆角 2–3px、1px 描边（圆角 >6px 属旧版语言）。 */
:root{
  --ink:#1a1a1a;--muted:#6e6e6e;--faint:#9a9a9a;--line:#dcdcdc;--line2:#c8c8c8;
  --accent:#1a1a1a;--accent-ink:#000000;--soft:#f0f0f0;--soft2:#e4e4e4;
  --warn:#3d3d3d;--warn-bg:#efefef;--bad:#000000;--bad-bg:#e2e2e2;
  --bg:#ebebeb;--panel:#ffffff;--canvas:#eef0f0;
  --mono:ui-monospace,Consolas,"Cascadia Mono",monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "Segoe UI",system-ui,"Microsoft YaHei",sans-serif}
code{font:11.5px var(--mono);background:var(--soft);padding:1px 5px;border-radius:2px}
.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:14px 18px 8px}
.crumb{font-size:11px;color:var(--muted);width:100%}
.badges{margin-left:auto;display:flex;gap:6px}
.badge{font:10.5px var(--mono);padding:3px 8px;border-radius:2px;background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.badge.warn{background:#ececec;color:#1b1b1b;border-color:#ececec;font-weight:600}
h1{font-size:18px;margin:0;font-weight:600;letter-spacing:.01em}
.sub{width:100%;font-size:11.5px;color:var(--muted);margin:2px 0 0}
.honesty{margin:4px 18px 0;border:1px solid var(--line);background:var(--panel);border-radius:2px;font-size:11.5px;color:var(--muted)}
.honesty summary{cursor:pointer;padding:8px 12px;font-weight:600;color:var(--ink)}
.honesty ol{margin:0;padding:0 18px 10px 30px}
.honesty li{margin:5px 0;line-height:1.7}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:12px;padding:10px 18px 16px;align-items:start}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:3px;overflow:hidden;display:flex;flex-direction:column}
.stage-bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 10px;border-bottom:1px solid var(--line);background:#fafafa}
.stage-bar .spacer{flex:1}
button{background:#fff;border:1px solid var(--line);border-radius:2px;padding:4px 9px;cursor:pointer;font:11.5px "Segoe UI",system-ui,"Microsoft YaHei",sans-serif;color:var(--ink)}
button:hover{background:var(--soft)}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#view{height:min(70vh,760px);min-height:420px;background:var(--canvas)}
.stage-foot{padding:8px 10px;font-size:11px;color:var(--muted);border-top:1px solid var(--line)}
aside{display:grid;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:12px 14px}
.card h2{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--soft);border:1px solid var(--line);border-radius:2px;padding:8px 10px}
.stat-v{font-size:16px;font-weight:600;color:var(--ink);font-family:var(--mono)}
.stat-k{font-size:10px;color:var(--muted);margin-top:2px}
.stat-n{font-size:10px;color:var(--faint);margin-top:1px}
.facts{margin:12px 0 0;display:grid;gap:0}
.fr{display:grid;grid-template-columns:88px minmax(0,1fr);gap:10px;padding:6px 0;border-bottom:1px solid #f0f0f0;font-size:12px}
.fr:last-child{border-bottom:0}
dt{color:var(--muted)}
dd{margin:0;overflow-wrap:anywhere}
.ctrl{display:grid;gap:10px}
.ctrl .group{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ctrl .lbl{font-size:11px;color:var(--muted);width:52px;flex:none}
label.sw{display:flex;gap:5px;align-items:center;font-size:12px;cursor:pointer}
input[type=range]{width:100%;accent-color:#1a1a1a}
.bar{height:11px;border-radius:2px;margin:8px 0 2px}
.legend{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.swatches{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;margin-top:8px}
.sw{display:flex;gap:5px;align-items:center}
.sw i{width:10px;height:10px;border-radius:2px;display:inline-block}
#hist{display:block;width:100%;height:auto;background:#fafafa;border:1px solid var(--line);border-radius:2px}
.hcap{font-size:11px;color:var(--muted);margin:6px 0 4px}
@media(max-width:1000px){.layout{grid-template-columns:1fr}}
</style></head>
<body>
<header class="top">
  <div class="crumb">__CRUMB__</div>
  <h1>__TITLE__</h1>
  <div class="badges">__BADGES__</div>
  <p class="sub">__SUB__</p>
</header>
<details class="honesty">
  <summary>诚实声明（务必先读）：__HONESTY_SUMMARY__</summary>
  <ol>__HONESTY__</ol>
</details>
<main class="layout">
  <section class="stage">
    <div class="stage-bar">
      <button id="bPersp" class="on">透视</button><button id="bFront">正视</button>
      <button id="bSide">侧视</button><button id="bTop">俯视</button>
      <button id="bSpin">自动旋转</button>
      <span class="spacer"></span>
      <button id="bSpeed" class="on">按速度着色</button><button id="bPress">按静压着色</button>
    </div>
    <div id="view"></div>
    <div class="stage-foot">左键拖动旋转 · 滚轮缩放 · 右键拖动平移。__FOOTNOTE__</div>
  </section>
  <aside>
    <section class="card"><h2>本次读数</h2><div class="stats">__STATS__</div><dl class="facts">__FACTS__</dl></section>
    <section class="card"><h2>显示控制</h2>
      <div class="ctrl">
        <div class="group"><span class="lbl">开关</span>
          <label class="sw"><input type="checkbox" id="cWall" checked>壁面</label>
          <label class="sw"><input type="checkbox" id="cAxis" checked>坐标尺</label>
          <label class="sw"><input type="checkbox" id="cL" checked>左</label>
          <label class="sw"><input type="checkbox" id="cR" checked>右</label>
          <label class="sw"><input type="checkbox" id="cOut" checked>出口加粗</label>
        </div>
        <div class="group"><span class="lbl">壁面透明</span><input type="range" id="rOpacity" min="2" max="60" value="20"></div>
        <div class="group"><span class="lbl">流线比例</span><input type="range" id="rLines" min="10" max="100" value="100"></div>
        <div class="bar" id="bar"></div>
        <div class="legend"><span id="lgMin"></span><span id="cbarTitle">速度 |U| (m/s)</span><span id="lgMax"></span></div>
      </div>
    </section>
    <section class="card"><h2>流线在腔内的长度分布</h2>
      <div class="hcap">共 __NLINES__ 条，抵达鼻咽出口 __NREACH__ 条（占 __PCT__%）；纵轴 = 条数。</div>
      <canvas id="hist"></canvas>
      <div class="swatches">
        <span class="sw"><i style="background:#d62728"></i>左鼻孔</span>
        <span class="sw"><i style="background:#1f77b4"></i>右鼻孔</span>
        <span class="sw"><i style="background:#2ca02c"></i>鼻咽出口</span>
        <span class="sw"><i style="background:#8d9bab"></i>坐标尺(mm)</span>
      </div>
    </section>
  </aside>
</main>
<script>__THREEJS__</script>
<script>const DATA = __DATA__;</script>
<script>__APP__</script>
</body></html>
