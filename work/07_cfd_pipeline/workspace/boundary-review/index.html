<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>边界草稿 · 鼻腔建模</title>
  <style>
    :root{color-scheme:light;--ink:#23332f;--muted:#6f7d75;--line:#dfe7e1;--bg:#f4f7f4;--accent:#257861;--soft:#edf5f0;--warn:#99691e;--bad:#b64e43}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,"Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;border-radius:7px;padding:7px 12px;color:var(--ink)}button.primary{color:#fff;background:var(--accent);border-color:var(--accent)}button:disabled{cursor:default;opacity:.45}input[type=text]{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:#fff;min-width:210px}.page{max-width:1180px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:18px}.top h1{font-size:21px;margin:0}.top p{color:var(--muted);margin:4px 0 0}.status{color:var(--muted);font-size:12px;text-align:right;max-width:360px}.grid{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:16px;align-items:start}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:17px}.panel h2{font-size:15px;margin:0 0 12px}.field{display:flex;align-items:center;gap:8px;margin:10px 0}.field label{font-size:12px;color:var(--muted);min-width:78px}.check{display:flex;gap:8px;align-items:flex-start;margin:11px 0;font-size:13px}.check input{margin-top:4px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.note{font-size:12px;color:var(--muted);margin:10px 0}.error{color:var(--bad);font-size:12px;overflow-wrap:anywhere}.evidence{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.evidence figure{margin:0;border:1px solid var(--line);background:#1d2226;border-radius:7px;overflow:hidden}.evidence img{display:block;width:100%;height:auto;min-height:100px;object-fit:contain;image-rendering:auto;cursor:zoom-in}.evidence figcaption{font-size:11px;color:#fff;padding:6px 8px}.meta{font-size:11px;color:var(--muted);overflow-wrap:anywhere;margin-top:12px}.mask-name{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.locked{color:var(--warn);background:#fff8e8;border:1px solid #efdfb9;padding:9px;border-radius:7px;font-size:12px;margin-top:12px}.success{color:var(--accent);font-size:12px;margin-top:10px}.lightbox{position:fixed;inset:0;background:rgba(13,19,16,.9);display:flex;align-items:center;justify-content:center;padding:24px;z-index:5}.lightbox img{max-width:96vw;max-height:92vh;width:auto;height:auto;object-fit:contain;image-rendering:auto;cursor:zoom-out}.lightbox[hidden]{display:none}@media(max-width:720px){.page{padding:14px}.top{display:block}.status{text-align:left;margin-top:8px}.grid{grid-template-columns:1fr}.evidence{grid-template-columns:1fr}.panel{padding:14px}}
  </style>
</head>
<body>
  <main class="page">
    <header class="top"><div><h1>边界草稿</h1><p id="case-label">读取病例…</p></div><div id="status" class="status" role="status">正在读取当前点位审核状态…</div></header>
    <div class="grid">
      <section class="panel">
        <h2>输入与策略</h2>
        <div class="field"><label for="reviewer">复核人</label><input id="reviewer" type="text" autocomplete="off"></div>
        <div class="check"><input id="oral-confirmed" type="checkbox"><label for="oral-confirmed">已确认口腔区域排除，鼻咽出口平面作为独立边界</label></div>
        <div class="check"><input id="sinus-confirmed" type="checkbox"><label for="sinus-confirmed">已确认主版本排除上颌、额、筛、蝶窦</label></div>
        <p id="mask-name" class="mask-name">尚未上传鼻窦排除掩膜</p>
        <div class="actions"><label><input id="mask" type="file" accept=".nii,.nii.gz,application/gzip"></label><button id="upload-mask">上传掩膜</button></div>
        <p class="note">掩膜必须与当前 CT 使用同一 LPS/mm 网格。上传后服务端会再次核对。</p>
        <div class="actions"><button id="generate" class="primary" disabled>生成绑定草稿</button><button id="back">返回切片审核</button></div>
        <p id="message" class="error" role="alert"></p>
        <div class="locked">草稿仅用于人工边界检查，当前不会解锁几何、网格或患者 CFD。</div>
      </section>
      <section class="panel">
        <h2>CT 与边界证据</h2>
        <div id="evidence" class="evidence"></div>
        <p id="meta" class="meta">生成绑定当前病例后显示。</p>
        <div class="actions"><button id="save" class="primary" disabled>保存边界审核</button></div>
        <p id="saved" class="success" role="status"></p>
      </section>
    </div>
  </main>
  <div id="lightbox" class="lightbox" hidden><img id="lightbox-image" alt="放大预览"></div>
  <script src="boundary-review.js" defer></script>
</body>
</html>
